name: Advisory AI Model Review

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-model-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.OMNI_AI_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      # Always use trusted base-branch code. The PR diff is fetched as inert text.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run advisory AI review
        id: ai_review
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OMNI_AI_REVIEW_API_KEY: ${{ secrets.OMNI_AI_REVIEW_API_KEY }}
          OMNI_AI_REVIEW_BASE_URL: ${{ vars.OMNI_AI_REVIEW_BASE_URL }}
          OMNI_AI_REVIEW_MODEL: ${{ vars.OMNI_AI_REVIEW_MODEL }}
        run: >-
          python scripts/ai_review_pr.py
          --event "$GITHUB_EVENT_PATH"
          --output /tmp/omni-ai-review.md
      - name: Publish or update advisory review
        if: steps.ai_review.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/omni-ai-review.md", "utf8");
            const marker = "<!-- omni-rewriter-ai-review -->";
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const previous = comments.find(
              (comment) => comment.user.type === "Bot" && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({...params, body});
            }
      - name: Report unavailable advisory reviewer
        if: steps.ai_review.outcome == 'failure'
        run: |
          echo "::warning::Advisory AI review was unavailable; deterministic checks still apply."
          echo "AI review unavailable; deterministic checks remain authoritative." >> "$GITHUB_STEP_SUMMARY"
