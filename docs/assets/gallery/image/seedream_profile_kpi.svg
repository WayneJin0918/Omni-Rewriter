<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Seedream-style prompt expansion profile KPI</title>
  <desc id="description">Four validated prompt-expansion guarantees: visual blueprint, ratio choice, exact text, and reference operations.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#26113d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#background)"/>
  <rect x="34" y="32" width="892" height="6" rx="3" fill="url(#accent)"/>
  <text x="56" y="92" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Seedream-style PE</text>
  <text x="56" y="126" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="18">OPEN PROFILE | VALIDATED PROMPT BLUEPRINT</text>
  <g font-family="Arial, sans-serif">
    <rect x="56" y="164" width="404" height="142" rx="18" fill="#171b35" stroke="#7c3aed" stroke-width="2"/>
    <text x="84" y="210" fill="#c4b5fd" font-size="16" font-weight="700">01 | VISUAL BLUEPRINT</text>
    <text x="84" y="250" fill="#f8fafc" font-size="25" font-weight="700">Single-paragraph scene plan</text>
    <text x="84" y="280" fill="#94a3b8" font-size="17">subject | composition | light | materials</text>
    <rect x="500" y="164" width="404" height="142" rx="18" fill="#171b35" stroke="#38bdf8" stroke-width="2"/>
    <text x="528" y="210" fill="#7dd3fc" font-size="16" font-weight="700">02 | RATIO CHOICE</text>
    <text x="528" y="250" fill="#f8fafc" font-size="25" font-weight="700">8 ratios + [image N]</text>
    <text x="528" y="280" fill="#94a3b8" font-size="17">validated against task and references</text>
    <rect x="56" y="334" width="404" height="142" rx="18" fill="#171b35" stroke="#f472b6" stroke-width="2"/>
    <text x="84" y="380" fill="#f9a8d4" font-size="16" font-weight="700">03 | EXACT VISIBLE TEXT</text>
    <text x="84" y="420" fill="#f8fafc" font-size="25" font-weight="700">&quot;Keep every character&quot;</text>
    <text x="84" y="450" fill="#94a3b8" font-size="17">language-aware quoting constraints</text>
    <rect x="500" y="334" width="404" height="142" rx="18" fill="#171b35" stroke="#34d399" stroke-width="2"/>
    <text x="528" y="380" fill="#6ee7b7" font-size="16" font-weight="700">04 | REFERENCE OPERATIONS</text>
    <text x="528" y="420" fill="#f8fafc" font-size="25" font-weight="700">preserve | change | merge</text>
    <text x="528" y="450" fill="#94a3b8" font-size="17">explicit image-by-image instructions</text>
  </g>
  <text x="56" y="514" fill="#64748b" font-family="Arial, sans-serif" font-size="15">Schema KPI | not a provider-generated image</text>
</svg>
