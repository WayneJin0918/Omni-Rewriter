<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omni-Rewriter — Promo</title>
  <meta name="description" content="Omni-Rewriter: open prompt expansion for video and image models.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #fff5f7;
      --muted: #f0c0cc;
      --rose: #e11d48;
      --rose-deep: #9f1239;
      --blush: #fb7185;
      --line: rgba(251, 113, 133, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      color: var(--ink);
      font-family: Manrope, system-ui, sans-serif;
      background: #0d0408;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
    }
    .stage video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #14060c;
    }
    .veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(13, 4, 8, 0.55) 0%, rgba(13, 4, 8, 0.18) 42%, rgba(13, 4, 8, 0.72) 100%),
        radial-gradient(900px 420px at 20% 0%, rgba(225, 29, 72, 0.22), transparent 55%);
    }
    .chrome {
      position: relative;
      z-index: 2;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1rem, 3vw, 1.75rem);
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: clamp(1.35rem, 3.2vw, 1.9rem);
      letter-spacing: -0.03em;
      color: var(--ink);
      text-decoration: none;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
    .brand span { color: var(--blush); }
    .lang {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(8, 2, 4, 0.45);
      backdrop-filter: blur(8px);
    }
    .lang button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
    }
    .lang button[aria-pressed="true"] {
      color: white;
      background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    }
    .hero {
      align-self: end;
      max-width: 34rem;
      padding-bottom: clamp(0.5rem, 2vh, 1.25rem);
      animation: rise 0.9s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .eyebrow {
      margin: 0 0 0.55rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--blush);
    }
    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: clamp(2rem, 5.5vw, 3.35rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      text-shadow: 0 10px 36px rgba(0, 0, 0, 0.45);
    }
    .lede {
      margin: 0.85rem 0 0;
      color: var(--muted);
      font-size: clamp(0.98rem, 2.2vw, 1.12rem);
      max-width: 30rem;
      text-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: 1.25rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.78rem 1.2rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.94rem;
      text-decoration: none;
      border: 1px solid transparent;
      transition: transform 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--rose), var(--rose-deep));
      color: white;
      box-shadow: 0 12px 30px rgba(225, 29, 72, 0.35);
    }
    .btn-ghost {
      border-color: var(--line);
      color: var(--ink);
      background: rgba(8, 2, 4, 0.4);
      backdrop-filter: blur(8px);
    }
    .btn-ghost:hover { border-color: var(--blush); color: white; }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: rgba(240, 192, 204, 0.75);
    }
    .foot a { color: var(--blush); }
    .skip {
      position: absolute;
      left: 1rem;
      top: 1rem;
      z-index: 5;
      transform: translateY(-160%);
      background: #1a0710;
      color: white;
      padding: 0.5rem 0.8rem;
      border-radius: 0.5rem;
    }
    .skip:focus { transform: none; }
    @media (max-width: 640px) {
      body { overflow: auto; }
      .stage { min-height: 100dvh; }
      .hero { align-self: center; }
    }
  </style>
</head>
<body>
  <a class="skip" href="home.html">Skip to site</a>
  <div class="stage">
    <video
      id="promo"
      poster="assets/promo/poster.png"
      playsinline
      muted
      autoplay
      preload="metadata"
    >
      <source src="assets/promo/omni_rewriter_promo.mp4" type="video/mp4">
    </video>
    <div class="veil" aria-hidden="true"></div>
    <div class="chrome">
      <div class="top">
        <a class="brand" href="home.html">Omni<span>-</span>Rewriter</a>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" id="lang-en" aria-pressed="true">EN</button>
          <button type="button" id="lang-zh" aria-pressed="false">中文</button>
        </div>
      </div>
      <div class="hero">
        <p class="eyebrow" data-i18n="eyebrow">Open prompt expansion</p>
        <h1 data-i18n="title">From messy intent to production-ready prompts</h1>
        <p class="lede" data-i18n="lede">An open harness that turns everyday video and image intent into structured, model-ready prompts.</p>
        <div class="cta-row">
          <a class="btn btn-primary" href="home.html" data-i18n="enter">Enter the site</a>
          <button class="btn btn-ghost" type="button" id="sound" data-i18n="sound">Unmute</button>
        </div>
      </div>
      <div class="foot">
        <span data-i18n="foot">Open prompt expansion for video and image</span>
        <a href="https://github.com/WayneJin0918/Omni-Rewriter">GitHub</a>
      </div>
    </div>
  </div>
  <script>
    const copy = {
      en: {
        eyebrow: "Open prompt expansion",
        title: "From messy intent to production-ready prompts",
        lede: "An open harness that turns everyday video and image intent into structured, model-ready prompts.",
        enter: "Enter the site",
        sound: "Unmute",
        soundOn: "Mute",
        foot: "Open prompt expansion for video and image",
      },
      zh: {
        eyebrow: "开放的提示词扩展",
        title: "从随口一句，到可投产的提示词",
        lede: "开源框架：把日常的视频与图像意图，整理成可对接模型的结构化提示。",
        enter: "进入主站",
        sound: "打开声音",
        soundOn: "关闭声音",
        foot: "面向视频与图像的开放提示词扩展",
      },
    };
    const video = document.getElementById("promo");
    const soundBtn = document.getElementById("sound");
    let lang = "en";

    function applyLang(next) {
      lang = next;
      const t = copy[lang];
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (key === "sound") {
          el.textContent = video.muted ? t.sound : t.soundOn;
        } else if (t[key]) {
          el.textContent = t[key];
        }
      });
      document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
      document.getElementById("lang-zh").setAttribute("aria-pressed", String(lang === "zh"));
    }

    document.getElementById("lang-en").addEventListener("click", () => applyLang("en"));
    document.getElementById("lang-zh").addEventListener("click", () => applyLang("zh"));

    soundBtn.addEventListener("click", async () => {
      video.muted = !video.muted;
      if (!video.muted) {
        try { await video.play(); } catch (_) { /* autoplay policies */ }
      }
      applyLang(lang);
    });

    video.addEventListener("ended", () => {
      // Hold last frame; user decides when to enter.
      video.pause();
    });

    // Prefer Chinese if browser locale suggests it.
    if ((navigator.language || "").toLowerCase().startsWith("zh")) {
      applyLang("zh");
    }
  </script>
</body>
</html>
