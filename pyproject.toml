[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omni-writer"
version = "0.1.0"
description = "Independent local Context-IR alternative for validated H3-oriented video rewrites"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
  { name = "Omni-Writer contributors" },
]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3"]
keywords = ["context-ir", "multimodal", "video", "h3", "qwen"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]

[project.optional-dependencies]
cli = ["typer>=0.12"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = [
  "build>=1.2",
  "fastapi>=0.115",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "typer>=0.12",
]

[project.scripts]
omni-writer = "omni_writer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_writer"]
include = [
  "src/omni_writer/**/*.py",
  "src/omni_writer/py.typed",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["omni_writer"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
