[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omni-rewriter"
version = "0.1.1"
description = "Open agentic prompt-expansion harness for image and video generation"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
  { name = "Omni-Rewriter contributors" },
]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "typer>=0.12"]
keywords = [
  "prompt-expansion",
  "prompt-engineering",
  "ai-agents",
  "agentic-ai",
  "multimodal",
  "image-generation",
  "video-generation",
  "structured-output",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/WayneJin0918/Omni-Rewriter"
Documentation = "https://waynejin0918.github.io/Omni-Rewriter/"
Repository = "https://github.com/WayneJin0918/Omni-Rewriter"
Issues = "https://github.com/WayneJin0918/Omni-Rewriter/issues"
Changelog = "https://github.com/WayneJin0918/Omni-Rewriter/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/omni-rewriter/"
HuggingFace = "https://huggingface.co/spaces/Wayne-King/omni-rewriter-replay"

[project.optional-dependencies]
cli = ["typer>=0.12"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = [
  "build>=1.2",
  "fastapi>=0.115",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "typer>=0.12",
]

[project.scripts]
omni-rewriter = "omni_rewriter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_rewriter"]
include = [
  "src/omni_rewriter/**/*.py",
  "src/omni_rewriter/py.typed",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.cursor",
  "/inputs",
  "/docs/assets",
  "/docs/day2-h3-pe",
  "/docs/h3-pe-showcase",
  "/docs/promo",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["omni_rewriter"]

[tool.coverage.run]
branch = true
source = ["omni_rewriter"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
